    <section class="panel"><h2>復習する問題を選ぶ</h2><div class="switches" role="group" aria-label="復習対象">${[['wrong','間違えた問題'],['answered','解いたすべて'],['due','復習時期が来た問題']].map(([type,label])=>`<button type="button" class="switch ${ui.reviewType===type?'active':''}" data-action="review-filter" data-type="${type}">${label}</button>`).join('')}</div><div class="fieldset" style="max-width:260px"><label for="review-subject">科目</label><select id="review-subject" class="select" data-setting="review-subject"><option value="all" ${ui.reviewSubject==='all'?'selected':''}>科目AとB</option><option value="A" ${ui.reviewSubject==='A'?'selected':''}>科目A</option><option value="B" ${ui.reviewSubject==='B'?'selected':''}>科目B</option></select></div>${list.length?`<p class="small-note">${list.length}問が該当します。</p><div class="table-wrap"><table class="data-table"><thead><tr><th>問題</th><th>分野・難易度</th><th>回答回数</th><th>誤答回数</th><th>操作</th></tr></thead><tbody>${list.map(q=>`<tr><td><strong>${X(q.id)}</strong><div class="small-note">${X(q.stem.split('\n')[0]).slice(0,54)}</div></td><td>${X(q.category)}<div class="small-note">${X(q.level)}</div></td><td class="num">${db.history[q.id].attempts}</td><td class="num">${db.history[q.id].wrong}</td><td><button class="btn btn-outline btn-sm" data-action="review-one" data-id="${q.id}">復習</button></td></tr>`).join('')}</tbody></table></div><div class="question-actions"><span class="small-note">一度正解しても、誤答履歴は消えません。</span>${button('review-start','この対象から続けて復習')}</div>`:`<div class="empty"><div class="big-icon">📘</div><h2>まだ該当する問題がありません</h2><p>学習を始めると、ここに問題がたまります。</p>${button('quickstart','問題を解いてみる')}</div>`}</section>
    <div class="two-col"><section class="panel"><h3>分野別の回答状況</h3><div class="table-wrap"><table class="data-table"><thead><tr><th>分野</th><th class="num">収録</th><th class="num">回答済み</th><th class="num">誤答あり</th></tr></thead><tbody>${Object.entries(M.categories||{}).map(([k,c])=>{const qs=Q.filter(q=>String(q.cat)===k&&q.exam==='A');return `<tr><td>${X(c.name)}</td><td class="num">${qs.length}</td><td class="num">${qs.filter(q=>db.history[q.id]?.attempts>0).length}</td><td class="num">${qs.filter(q=>db.history[q.id]?.wrong>0).length}</td></tr>`}).join('')}</tbody></table></div></section><section class="panel"><h3>学習履歴のバックアップ</h3><p>進捗はこのブラウザにのみ保存されます。スマートフォンや別のブラウザには自動同期されません。</p>${button('export','JSONをエクスポート','btn btn-outline btn-sm')} ${button('import','JSONをインポート','btn btn-outline btn-sm')}<div class="break-line"></div>${button('reset','すべての学習履歴を削除','btn btn-danger btn-sm')}<p class="small-note">削除前に確認画面を表示します。</p></section></div>`;
  }
  function startSingleReview(id){const q=qmap.get(id);if(!q)return;const s={pool:[id],filters:{subject:q.exam,cat:String(q.cat),level:'all',condition:'answered',limit:1},review:true,seen:[],recent:[],position:0,limit:1,correct:0};ui.session=s;ui.screen='reviewquiz';nextSessionQ(true)}
  function startReview(){const p=reviewList();if(!p.length){notify('復習対象がありません。');return}const s={pool:p.map(q=>q.id),filters:{subject:ui.reviewSubject,cat:'all',level:'all',condition:'all',limit:0},review:true,seen:[],recent:[],position:0,limit:0,correct:0};ui.session=s;ui.screen='reviewquiz';nextSessionQ(true)}
  function mockPage(){const a=Q.filter(q=>q.exam==='A').length,b=Q.filter(q=>q.exam==='B').length,ba=Q.filter(q=>q.exam==='B'&&q.cat!==11).length,bs=Q.filter(q=>q.exam==='B'&&q.cat===11).length;
    const fmt=w=>`<strong>${w}</strong>`;
    return `<div class="page-heading"><div><div class="eyebrow">EXAM SIMULATION</div><h1>模試形式で練習</h1><p>問題をまとめて解いて、終了後に解答を確認します。</p></div>${button('home','ホームへ','btn btn-outline btn-sm')}</div><div class="notice critical"><strong>現在は採点保留の試作モードです。</strong><br>試験時間・出題数はIPAの現行仕様に合わせていますが、設問ごとの外部根拠検証と本番難易度への照合が未完了です。このため、終了後の<strong>合格判定・点数・正答率は表示せず</strong>、回答と各問題の暫定解答を確認する形式にしています。</div>
      <div class="mock-hero"><div class="mock-info"><span>科目A · 知識問題（四肢択一）</span><strong>60問 <span class="pill gray">90分</span></strong><p class="small-note">収録${a}問。未回答の問題をなるべく優先。初見問題が不足する場合は既出を含みます。</p>${button('start-mock-A','科目Aを開始', 'btn btn-primary', a<60?'disabled':'')}</div><div class="mock-info"><span>科目B · アルゴリズム／セキュリティ</span><strong>20問 <span class="pill gray">100分</span></strong><p class="small-note">収録${b}問。擬似言語16問＋セキュリティ4問。全問4択の簡略版で、本番の長文・選択肢数は再現していません。</p>${button('start-mock-B','科目Bを開始','btn btn-primary',(ba<16||bs<4)?'disabled':'')}</div></div>
      <div class="two-col"><section class="panel"><h3>模試の流れ</h3><div class="meta-list"><div><span>1</span><strong>科目を選んでスタート</strong></div><div><span>2</span><strong>回答・見直し・問題間の移動</strong></div><div><span>3</span><strong>終了まで正解や解説は非表示</strong></div><div><span>4</span><strong>終了後に解答と暫定解説を確認</strong></div></div></section><section class="panel"><h3>試験時間と採点</h3><p>実際の科目A・Bはそれぞれ1,000点満点・600点以上が合格基準です。ただしIRT方式で評価されるため、本サイトで公式スコアを再現することはできません。</p><p>模試中に使った問題は既出として記録され、次回は可能な限り未使用を優先します。</p><p class="small-note">公式要綱Ver.5.6（2026年10月から適用）</p></section></div>`;
  }
  function pickMockQuestions(part){const eligible=Q.filter(q=>q.exam===part),notUsed=(q)=>!db.examSeen.includes(q.id),notAnswered=(q)=>!(db.history[q.id]?.attempts>0);
    const ordered=(pool)=>pool.map(q=>({...q,rank:(notUsed(q)?4:0)+(notAnswered(q)?2:0)+Math.random()})).sort((a,b)=>b.rank-a.rank);
    if(part==='A'){if(eligible.length<60)return [];return ordered(eligible).slice(0,60).map(q=>q.id)}
    const alg=eligible.filter(q=>q.cat!==11),sec=eligible.filter(q=>q.cat===11);
    if(alg.length<16||sec.length<4)return [];
    return shuffle([...ordered(alg).slice(0,16),...ordered(sec).slice(0,4)]).map(q=>q.id);
  }
  function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
  function startMock(part){if(!['A','B'].includes(part))return;const ids=pickMockQuestions(part);if(!ids.length){notify('模試形式の出題に必要な問題数が足りません。');return}
    ui.mock={part,ids,i:0,answers:{},flags:[],deadline:Date.now()+(part==='A'?90:100)*60*1000,started:Date.now(),hasPrior:ids.filter(id=>db.examSeen.includes(id)||db.history[id]?.attempts>0).length};ui.screen='mockrun';checkpointMock();render();window.scrollTo(0,0);
  }
  function checkpointMock(){if(!ui.mock)return;db.activeMock={part:ui.mock.part,ids:ui.mock.ids,answers:{...ui.mock.answers},flags:[...ui.mock.flags],i:ui.mock.i,deadline:ui.mock.deadline,started:ui.mock.started};save()}
  function mockRunPage(){const m=ui.mock;if(!m)return mockPage();const q=qmap.get(m.ids[m.i]),answer=(m.answers[q.id]??null),remaining=Math.max(0,Math.ceil((m.deadline-Date.now())/1000)),done=Object.keys(m.answers).length;
    return `<div class="quiz-toolbar"><div class="crumb"><span class="pill">科目${m.part}</span><span>›</span> 模試形式（採点保留）</div>${button('mock-quit','× 途中終了','btn btn-outline btn-sm')}</div><div class="study-layout"><section class="study-main"><div class="study-panel"><div class="question-top"><div class="question-top-left"><span class="pill gray">${X(q.level)}</span><span class="pill amber">模試体験</span><span class="question-counter">問 ${m.i+1} / ${m.ids.length}</span></div><span class="mock-clock" id="mock-clock">${fmtTime(remaining)}</span></div>${questionStem(q)}${optionRows(q,'mock',answer)}<p class="small-note">模試中は正解・解説を表示しません。回答は後から変更できます。</p><div class="question-actions"><div>${button('mock-prev','← 前の問題','btn btn-outline btn-sm',m.i===0?'disabled':'')} ${button('mock-flag',m.flags.includes(q.id)?'★ あとで見直す：解除':'☆ あとで見直す','btn btn-outline btn-sm')}</div><div>${m.i<m.ids.length-1?button('mock-next','次の問題 →'):button('mock-finish','この科目を終了して確認')}</div></div></div></section><aside class="study-side"><div class="panel"><h3>回答状況</h3><div class="mini-stat"><span>回答済み</span><strong>${done} / ${m.ids.length}</strong></div>${fill(done/m.ids.length*100)}<div class="break-line"></div><div class="mock-palette">${m.ids.map((id,i)=>`<button type="button" data-action="mock-goto" data-i="${i}" aria-label="${i+1}問目へ" class="${id in m.answers?'answered':''} ${i===m.i?'current':''} ${m.flags.includes(id)?'flagged':''}">${i+1}</button>`).join('')}</div></div><div class="panel"><h3>試験の注意</h3><p>この試作モードには外部根拠未照合の問題が含まれます。合否判定や点数は表示しません。</p>${m.hasPrior?`<p class="small-note">既出の可能性がある問題：${m.hasPrior}問</p>`:'<p class="small-note">可能な範囲で初見を優先しています。</p>'}</div></aside></div>`;
  }
  function stopClock(){if(interval){clearInterval(interval);interval=null}}
  function startClock(){stopClock();interval=setInterval(()=>{if(ui.screen!=='mockrun'||!ui.mock){stopClock();return}const left=Math.max(0,Math.ceil((ui.mock.deadline-Date.now())/1000));const el=document.getElementById('mock-clock');if(el)el.textContent=fmtTime(left);if(left<=0){notify('制限時間になりました。回答を確定します。');finishMock()}},1000)}
  function mockAnswer(i){const m=ui.mock;if(!m||i<0||i>3)return;const q=qmap.get(m.ids[m.i]);m.answers[q.id]=i;checkpointMock();render()}
  function mockMove(i){const m=ui.mock;if(!m||i<0||i>=m.ids.length)return;m.i=i;checkpointMock();render();window.scrollTo(0,0)}
  function mockFlag(){const m=ui.mock;if(!m)return;const id=m.ids[m.i];if(m.flags.includes(id))m.flags=m.flags.filter(x=>x!==id);else m.flags.push(id);checkpointMock();render()}
  function finishMock(){const m=ui.mock;if(!m)return;stopClock();const result={...m,answers:{...m.answers},when:Date.now()};ui.mockResult=result;ui.mock=null;db.examSeen=[...new Set([...db.examSeen,...m.ids])];db.mocks.push({when:result.when,type:m.part,total:m.ids.length,answered:Object.keys(m.answers).length,graded:false});db.mocks=db.mocks.slice(-100);db.activeMock=null;save();ui.screen='mockresult';ui.feedbackReviewId=null;render();window.scrollTo(0,0)}
  function closeMock(force=false){if(!ui.mock)return;const m=ui.mock;if(!force&&!confirm('途中終了しますか？ 回答した内容を確認画面で表示します。'))return;finishMock()}
  function resumePage(){return `<div class="page-heading"><div><div class="eyebrow">CONTINUE</div><h1>前回の模試形式の演習</h1><p>途中の回答が保存されています。</p></div></div><section class="panel"><p>科目${X(db.activeMock?.part)}の途中結果が残っています。制限時間は再開後も進みます。</p><div class="question-actions">${button('discard-mock','中断してホームへ','btn btn-outline')}${button('resume-mock','続きから再開')}</div></section>`}
  function resumeMock(){const m=db.activeMock;if(!m){nav('home');return}ui.mock={...m,hasPrior:m.ids.filter(id=>db.examSeen.includes(id)).length};ui.screen='mockrun';if(Date.now()>ui.mock.deadline){finishMock();return}render()}
  function mockResultPage(){const m=ui.mockResult;if(!m)return mockPage();const done=Object.keys(m.answers).length;
    return `<div class="page-heading"><div><div class="eyebrow">EXAM REVIEW</div><h1>科目${m.part}の演習を終了しました</h1><p>正誤と解説の最終確定は、個別の根拠照合が完了してから行います。</p></div></div><div class="notice critical"><strong>成績評価は行っていません。</strong><br>収録問題は独立した一次資料での全問照合が未完了です。合否判定・推定点数・正答率は表示しません。下記の「暫定正解」と解説は学習の参考にとどめてください。</div><div class="result-grid" style="margin:18px 0"><div class="result-unit"><div class="value">${m.ids.length}問</div><small>出題問題数</small></div><div class="result-unit"><div class="value">${done}問</div><small>回答した問題数</small></div></div><section class="panel"><h2>問題ごとの解答・解説</h2><p class="small-note">問題を開いて解答と解説を確認してください。公式の解答例ではありません。</p>${m.ids.map((id,i)=>{const q=qmap.get(id),v=m.answers[id],answered=v!==undefined;return `<details class="details" style="border-bottom:1px solid #edf1f6;padding-bottom:15px"><summary>問${i+1} · ${X(q.category)} · ${answered?'回答：'+String.fromCharCode(65+v):'未回答'} ${m.flags.includes(id)?'★':''}</summary><div style="padding:16px 0">${questionStem(q)}<div class="options">${q.choices.map((t,j)=>`<div class="option ${j===q.answer?'correct':j===v?'incorrect':''}"><span class="option-letter">${String.fromCharCode(65+j)}</span><span class="option-text">${X(t)}</span></div>`).join('')}</div><p><strong>暫定解答：${String.fromCharCode(65+q.answer)}</strong></p><p>${X(q.summary)}</p><ul>${q.details.map((d,j)=>`<li class="small-note">${String.fromCharCode(65+j)}：${X(d)}</li>`).join('')}</ul>${referenceBox(q)}</div></details>`}).join('')}<div class="question-actions">${button('mock','模試メニューへ','btn btn-outline')}${button('home','ホームへ')}</div></section>`;
  }
  function exportData(){const txt=JSON.stringify({...db,exportedAt:new Date().toISOString(),note:'FE Study Lab 2026.10 / 旧版データを誤帰属しないため問題IDとバージョンを照合'},null,2);const blob=new Blob([txt],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='基本情報技術者_学習履歴_'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'_'+String(Date.now())+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);notify('学習履歴をJSONでエクスポートしました。')}
  function importData(){const el=document.createElement('input');el.type='file';el.accept='.json,application/json';el.addEventListener('change',async()=>{if(!el.files?.length)return;const f=el.files[0];if(f.size>4*1024*1024){notify('ファイルが4MBを超えています。');return}try{const contents=await f.text(),parsed=JSON.parse(contents),fresh=sanitize(parsed);if(!confirm('現在の学習履歴を、選択したJSONの内容で置き換えますか？'))return;db=fresh;ui.mock=null;ui.session=null;ui.screen=db.activeMock?'resume':'home';save();render();notify('学習履歴を読み込みました。')}catch(e){notify('ファイルを読み込めません。資格・形式・版をご確認ください。');console.warn(e)}},{once:true});el.click()}
  function reset(){if(!confirm('学習履歴（回答・誤答・模試利用履歴）をすべて削除しますか？ 取り消せません。'))return;db=blank();save();ui.screen='home';render();notify('学習履歴を初期化しました。')}
  APP.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action, idx=Number(el.dataset.i);
    if(action==='home')nav('home');
    else if(action==='quickstart')startSession({subject:'all',cat:'all',level:'all',condition:'all',limit:0});
    else if(action==='settings'||action==='practice')nav('settings');
    else if(action==='review')nav('review');
    else if(action==='mock')nav('mock');
    else if(action==='answer')answerPractice(idx);
    else if(action==='next')nextSessionQ();
    else if(action==='practice-end')nav('home');
    else if(action==='start-filtered')startSession(ui.filters);
    else if(action==='review-filter'){ui.reviewType=el.dataset.type;render()}
    else if(action==='review-one')startSingleReview(el.dataset.id);
    else if(action==='review-start')startReview();
    else if(action==='start-mock-A')startMock('A');
    else if(action==='start-mock-B')startMock('B');
    else if(action==='mock-answer')mockAnswer(idx);
    else if(action==='mock-next')mockMove(ui.mock.i+1);
    else if(action==='mock-prev')mockMove(ui.mock.i-1);
    else if(action==='mock-goto')mockMove(idx);
    else if(action==='mock-flag')mockFlag();
    else if(action==='mock-finish') {if(!ui.mock)return;const n=ui.mock.ids.length-Object.keys(ui.mock.answers).length;if(n>0&&!confirm(`${n}問が未回答です。このまま終了しますか？`))return;finishMock()}
    else if(action==='mock-quit')closeMock();
    else if(action==='resume-mock')resumeMock();
    else if(action==='discard-mock'){if(confirm('途中の模試形式の演習を破棄しますか？')){db.activeMock=null;save();nav('home')}}
    else if(action==='export')exportData();
    else if(action==='import')importData();
    else if(action==='reset')reset();
  });
  APP.addEventListener('change',e=>{const el=e.target;if(!el.matches('[data-setting]'))return;const key=el.dataset.setting;
    if(key==='review-subject'){ui.reviewSubject=el.value;render()}
    else if(['subject','cat','level','condition','limit'].includes(key)){ui.filters[key]=key==='limit'?Number(el.value):el.value;}
  });
  document.getElementById('brand-home').addEventListener('click',()=>nav('home'));
  document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{const x=b.dataset.nav;nav(x==='practice'?'settings':x)}));
  document.addEventListener('keydown',e=>{const tag=e.target?.tagName||'';if(['INPUT','SELECT','TEXTAREA','BUTTON'].includes(tag)||e.ctrlKey||e.metaKey||e.altKey)return;
    if(['quiz','reviewquiz'].includes(ui.screen)&&ui.answered===null&&e.key>='1'&&e.key<='4'){e.preventDefault();answerPractice(Number(e.key)-1)}
    else if(['quiz','reviewquiz'].includes(ui.screen)&&ui.answered!==null&&e.key==='Enter'){e.preventDefault();nextSessionQ()}
  });
  window.addEventListener('beforeunload',()=>{if(ui.screen==='mockrun'&&ui.mock)checkpointMock()});
  render();
})();

  </script>
